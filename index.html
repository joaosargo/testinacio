<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    /* dec-css-centering: center the label in the viewport with flexbox */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
    }

    .hello-label {
      font-size: 2rem;
      /* req-red-text: the Hello World label renders in red */
      color: #ff0000;
    }
  </style>
</head>
<body>
  <!-- req-display-hello-world / req-center-label: centered Hello World label -->
  <main class="hello-label" data-testid="hello-world-label">Hello World</main>
</body>
</html>
